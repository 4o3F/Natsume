[advisories]
yanked = "deny"
ignore = [
  # Operator-approved standalone-crate maintenance exceptions, not vulnerability waivers.
  # Advisory exceptions are ID-scoped; versions below are review context, not bounds.
  # Re-review on every Slint/Zbus dependency bump; remove when Slint adopts Zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "Slint 1.18.1's Winit backend requires zbus 5.19.0, retaining unmaintained zvariant 5.15.1; its maintained replacement is Zbus 6's wire module; remove when Slint eliminates this standalone crate; owner: repository owner, approved 2026-10-19" },
  { id = "RUSTSEC-2026-0371", reason = "Slint 1.18.1's Winit backend requires zbus 5.19.0, retaining unmaintained zbus_names 4.3.5; its maintained replacement is Zbus 6's names module; remove when Slint eliminates this standalone crate; owner: repository owner, approved 2026-10-19" },
  { id = "RUSTSEC-2026-0372", reason = "Slint 1.18.1's Winit backend requires zbus 5.19.0, retaining unmaintained zvariant_derive 5.15.1; its maintained replacement is Zbus 6's derives; remove when Slint eliminates this standalone crate; owner: repository owner, approved 2026-10-19" },
  { id = "RUSTSEC-2026-0192", reason = "Slint 1.18.1's wayland feature enables winit 0.30's wayland-csd-adwaita, whose sctk-adwaita → ab_glyph → owned_ttf_parser chain retains unmaintained ttf-parser 0.25.1; remove when that chain drops ttf-parser or Slint stops forcing Adwaita client-side decorations; owner: repository owner, recorded 2026-08-14, path re-reviewed 2026-11-11" },
  { id = "RUSTSEC-2026-0441", reason = "Slint 1.18.1's build, macro and Skia dependencies require spin_on 0.1.1, retaining unmaintained pin-utils 0.1.1; re-review on every Slint/spin_on dependency bump; remove when the dependency graph no longer includes pin-utils; owner: repository owner, approved 2026-11-05" },
  # Temporary vulnerability waiver; remove as soon as Diesel accepts the patched libsqlite3-sys.
  { id = "RUSTSEC-2026-0459", reason = "Diesel 2.3.14 caps libsqlite3-sys below 0.39, retaining bundled SQLite 3.53.2; the Server opens only its service-owned database, while Photo Client is exposed only when an operator opens an untrusted workspace with a crafted -wal file; remove when Diesel 2.3.x accepts libsqlite3-sys 0.39 (diesel-rs/diesel#5372) and lockfile maintenance upgrades it; owner: repository owner, approved 2026-11-11" },
]

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
]

[bans]
# Upstream GUI and server stacks may require incompatible versions.
# Report duplicates for review without blocking otherwise valid dependency updates.
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
include-dev = true
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
