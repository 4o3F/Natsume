<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.natsume.Privileged1"/></policy>
  <policy user="natsume"><allow send_destination="org.natsume.Privileged1"/></policy>
  <!-- Restrict RPC callers without suppressing systemd/logind signals to the owner. -->
  <policy context="default"><deny send_destination="org.natsume.Privileged1" send_type="method_call"/></policy>
</busconfig>
