<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Natsume 工作站状态</title>
    <link rel="stylesheet" href="/_natsume/status.css" />
  </head>
  <body data-state="restoring">
    <main class="status-card" aria-live="polite" aria-busy="true">
      <header class="brand">
        <img src="/_natsume/icons.svg" alt="" width="52" height="52" />
        <div>
          <p class="eyebrow">NATSUME WORKSTATION</p>
          <p class="brand-subtitle" id="brand-subtitle">本地比赛网关</p>
        </div>
      </header>

      <section class="hero">
        <span class="badge" id="state-badge">RESTORING</span>
        <h1 id="state-title">正在恢复比赛网关</h1>
        <p id="state-detail">请保持此页面打开。工作站会在安全检查完成后自动继续。</p>
      </section>

      <section class="progress-panel" id="progress-panel" hidden>
        <div class="progress-heading">
          <span id="progress-label">处理进度</span>
          <span id="progress-value">0 / 0</span>
        </div>
        <progress id="progress" value="0" max="1">0%</progress>
      </section>

      <dl class="facts">
        <div>
          <dt id="machine-label">设备</dt>
          <dd id="machine-id">—</dd>
        </div>
        <div>
          <dt id="seat-label-title">赛位</dt>
          <dd id="seat-label">—</dd>
        </div>
        <div>
          <dt id="updated-label">更新时间</dt>
          <dd id="updated-at">—</dd>
        </div>
        <div>
          <dt id="operation-label">操作</dt>
          <dd id="operation-id">—</dd>
        </div>
      </dl>

      <aside class="action" id="suggested-action">正在等待本地服务完成检查。</aside>
      <footer id="footer-note">此页面只显示本机非敏感状态，不会展示比赛账号或密码。</footer>
    </main>
    <script src="/_natsume/status.js" defer></script>
  </body>
</html>
