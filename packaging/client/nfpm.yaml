
name: natsume-client
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Natsume Project
vendor: Natsume Project
homepage: https://github.com/4o3F/Natsume
description: Natsume V2 workstation client, local gateway and OS integration
umask: 0o022
depends:
  - ca-certificates
  - dbus
  - fonts-noto-cjk
  - libfontconfig1
  - libpam-modules
  - libfreetype6
  - libstdc++6
  - libsystemd0
  - libudev1
  - systemd (>= 253)
  - util-linux

contents:
  - src: ${RUST_RELEASE_DIR}/natsume-device-daemon
    dst: /usr/bin/natsume-device-daemon
    file_info: {mode: 0o755}
  - src: ${RUST_RELEASE_DIR}/natsume-privileged-helper
    dst: /usr/lib/natsume/natsume-privileged-helper
    file_info: {mode: 0o755}
  - src: ${RUST_RELEASE_DIR}/natsume-session-agent
    dst: /usr/bin/natsume-session-agent
    file_info: {mode: 0o755}
  - src: ${CADDY_BIN}
    dst: /usr/lib/natsume/caddy
    file_info: {mode: 0o755}
  - src: packaging/client/rootfs/usr/
    dst: /usr/
    type: tree
  - src: packaging/image/
    dst: /usr/share/natsume/image-integration/
    type: tree
  - src: packaging/client/rootfs/etc/pam.d/
    dst: /etc/pam.d/
    type: tree
  - src: packaging/client/rootfs/etc/natsume/caddy/
    dst: /etc/natsume/caddy/
    type: tree
  - src: packaging/client/config.example.toml
    dst: /usr/share/doc/natsume-client/config.example.toml
    file_info: {mode: 0o644}

scripts:
  postinstall: packaging/client/scripts/postinstall.sh
  preremove: packaging/client/scripts/preremove.sh
  postremove: packaging/client/scripts/postremove.sh
