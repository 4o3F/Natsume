repos:
  - repo: local
    hooks:
      - id: build-scripts
        name: Natsume build scripts
        entry: deno task check scripts
        language: system
        always_run: true
        pass_filenames: false
      - id: dependency-policy
        name: Natsume dependency policy
        entry: cargo deny check
        language: system
        always_run: true
        pass_filenames: false
      - id: web-format
        name: Natsume Web Prettier
        entry: pnpm --dir web format:check
        language: system
        always_run: true
        pass_filenames: false
      - id: web-lint
        name: Natsume Web lint
        entry: pnpm --dir web lint
        language: system
        always_run: true
        pass_filenames: false
      - id: rust-clippy
        name: Natsume Rust Clippy
        entry: deno task check rust
        language: system
        always_run: true
        pass_filenames: false
      - id: rust-test
        name: Natsume Rust tests
        entry: cargo test --workspace --all-features --locked
        language: system
        always_run: true
        pass_filenames: false
      - id: web-test
        name: Natsume Web tests
        entry: pnpm --dir web test
        language: system
        always_run: true
        pass_filenames: false
