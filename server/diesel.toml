[print_schema]
file = "diesel/schema.rs"
# SQLite STRICT requires INTEGER while these values use Diesel BigInt/i64.
patch_file = "diesel/sqlite-integer-to-bigint.patch"
filter.only_tables = [
  "^account_mappings$",
  "^accounts$",
  "^binding_negotiations$",
  "^device_bindings$",
  "^device_control_keys$",
  "^device_home_targets$",
  "^device_session_targets$",
  "^devices$",
  "^gateway_credentials$",
  "^operator_accounts$",
  "^operator_sessions$",
  "^pending_import_candidate$",
  "^runtime_config$",
  "^seats$",
  "^server_vault_records$",
  "^site_identity$",
]
