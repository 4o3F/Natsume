[package]
name = "natsume-privileged-helper"
description = "Root, no-network Natsume helper for typed privileged actions, hardware evidence and Home transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
snafu.workspace = true
libsystemd = "0.7"
natsume-error-code = { path = "../../crates/error-code" }
natsume-local-control-api = { path = "../../crates/local-control-api" }
natsume-machine-identity = { path = "../../crates/machine-identity" }
procfs = { version = "0.18", default-features = false }
raw-cpuid = "11.6"
rustix = { version = "1", features = ["fs", "mount", "process"] }
serde.workspace = true
sha2.workspace = true
smbios-lib = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
udev = "0.9"
zbus.workspace = true
zeroize.workspace = true

[lints]
workspace = true
