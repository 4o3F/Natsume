
[workspace]
resolver = "3"
members = [
  "server",
  "client/device-daemon",
  "client/privileged-helper",
  "client/session-agent",
  "crates/device-protocol",
  "crates/local-control-api",
  "crates/machine-identity",
]
default-members = [
  "server",
  "client/device-daemon",
  "client/privileged-helper",
  "client/session-agent",
  "crates/device-protocol",
  "crates/local-control-api",
  "crates/machine-identity",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio", "ws"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
cookie = { version = "=0.18.1", default-features = false }
diesel = { version = "2.3.12", default-features = false, features = ["sqlite", "r2d2", "32-column-tables"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["sqlite"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = "0.13"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
roxmltree = "0.20"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = { version = "7.5", default-features = false }
rustix = { version = "1", features = ["fs", "mount", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
secrecy = { version = "0.10", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = { version = "0.11", default-features = false }
slint = { version = "1.15", default-features = false, features = ["compat-1-2", "std", "backend-winit-x11", "renderer-skia"] }
snafu = "0.9"
subtle = { version = "2.6", default-features = false }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "proc-macro", "visit"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs", "limit", "set-header"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
utoipa = { version = "5", default-features = false, features = ["macros", "uuid"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }
x509-parser = { version = "0.18", default-features = false }
zeroize = { version = "1", features = ["derive", "serde"] }
zbus = { version = "5", default-features = false, features = ["option-as-array", "p2p", "tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
