
[workspace]
resolver = "3"
members = [
  "crates/natsume-photo-protocol",
  "crates/natsume-photo-client/backend",
  "crates/natsume-server",
  "crates/natsume-server-setup",
  "crates/natsume-workstation-daemon",
  "crates/natsume-workstation-helper",
  "crates/natsume-workstation-agent",
  "crates/natsume-workstation-protocol",
  "crates/natsume-workstation-ipc",
  "crates/natsume-print-domjudge",
  "crates/natsume-print-client"
]
default-members = [
  "crates/natsume-photo-client/backend",
  "crates/natsume-server",
  "crates/natsume-server-setup",
  "crates/natsume-workstation-daemon",
  "crates/natsume-workstation-helper",
  "crates/natsume-workstation-agent",
  "crates/natsume-workstation-protocol",
  "crates/natsume-workstation-ipc",
  "crates/natsume-print-domjudge",
  "crates/natsume-print-client"
]

[workspace.package]
version = "2.12.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = [
  "alloc",
  "password-hash"
] }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "query",
  "tokio",
  "ws"
] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
calamine = { version = "0.37.0", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = [
  "alloc",
  "zeroize"
] }
clap = { version = "4", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context"
] }
cookie = { version = "=0.18.2", default-features = false }
diesel = { version = "2.3.14", default-features = false, features = [
  "sqlite",
  "r2d2",
  "32-column-tables"
] }
diesel_migrations = { version = "2.3.2", default-features = false, features = [
  "sqlite"
] }
ed25519-dalek = { version = "3.0", default-features = false, features = [
  "alloc",
  "pkcs8",
  "zeroize"
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink"
] }
getrandom = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = "0.13"
lopdf = { version = "=0.45.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp"
] }
moxcms = "0.8.1"
kamadak-exif = "0.6.1"
png = "0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "date"] }
resvg = { version = "0.48", default-features = false, features = [
  "text",
  "system-fonts",
  "raster-images"
] }
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace"
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "grpc-tonic"
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace"
] }
percent-encoding = { version = "2.3", default-features = false, features = [
  "alloc"
] }
pkcs8 = { version = "0.11", default-features = false, features = [
  "std",
  "pem",
  "encryption",
  "getrandom"
] }
pkcs5 = { version = "0.8", default-features = false, features = [
  "alloc",
  "pbes2"
] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
roxmltree = "0.21"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls"
] }
rpassword = { version = "7.5", default-features = false }
rustix = { version = "1", features = ["fs", "mount", "process"] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std"
] }
rustls-pki-types = "1"
secrecy = { version = "0.10", default-features = false }
sec1 = { version = "0.8", default-features = false, features = [
  "alloc",
  "der",
  "pem"
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4.1"
serde-saphyr = { version = "2.0", default-features = false, features = [
  "serialize"
] }
sha2 = { version = "0.11", default-features = false }
# Require Skia binaries; never fall back to building upstream sources.
skia-bindings = { version = "0.153", features = ["no-compile"] }
slint = { version = "1.18", default-features = false, features = [
  "compat-1-2",
  "std"
] }
snafu = "0.9"
subtle = { version = "2.6", default-features = false }
syn = { version = "3.0.9", default-features = false, features = [
  "full",
  "parsing",
  "proc-macro",
  "visit"
] }
time = { version = "0.3", default-features = false, features = [
  "std",
  "parsing",
  "formatting"
] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
  "connect",
  "__rustls-tls"
] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
toml = { version = "1.1", default-features = false, features = [
  "parse",
  "serde",
  "std"
] }
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = [
  "fs",
  "set-header"
] }
trybuild = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt"
] }
url = "2.5"
specta = { version = "=2.0.0-rc.25", features = ["derive", "collect", "uuid"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
uuid = { version = "1", features = ["serde", "v5", "v7"] }
windows = "0.62.2"
x509-parser = { version = "0.18", default-features = false }
zeroize = { version = "1", features = ["derive", "serde"] }
zbus = { version = "6", default-features = false, features = [
  "option-as-array",
  "p2p",
  "proxy",
  "service",
  "tokio"
] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
