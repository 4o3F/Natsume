name: ci

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]
  workflow_call:
    inputs:
      package_version:
        description: Debian package version
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SKIA_BINARIES_URL: file://${{ github.workspace }}/target/build/downloads/skia-binaries-{key}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            dbus-daemon libfontconfig1-dev libgl1-mesa-dev libudev-dev pkg-config

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy,rustfmt

      - name: Install pinned Rust tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install diesel_cli --version 2.3.12 --locked --no-default-features --features sqlite-bundled

      - name: Setup Node for TypeScript generation
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.node-version

      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Setup pinned Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version-file: .deno-version

      - name: Prepare Rust and TypeScript-generation dependencies
        run: deno task prepare rust web

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust compile checks
        run: deno task check scripts rust

      - name: Build orchestration tests
        run: deno test --cached-only --frozen --allow-read --allow-write=target --allow-env --allow-run --deny-net tools/build_test.ts

      - name: Check generated TypeScript bindings
        run: deno task api --check

      - name: Check generated Diesel schema
        run: deno task schema:check

      - name: Unit and integration tests
        run: cargo test --workspace --all-features --locked --lib --bins --tests

      - name: Documentation tests
        run: cargo test --workspace --all-features --locked --doc

      - name: Dependency policy and advisories
        run: cargo deny check

  windows-print:
    name: Windows print engine
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy,rustfmt

      - name: Setup pinned Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version-file: .deno-version

      - name: Prepare Rust dependencies without Linux workstation assets
        run: deno task prepare rust

      - name: Compile and lint the Windows engine
        run: cargo clippy --frozen -p natsume-print-client --all-targets -- -D warnings

      - name: Test shared logic and the Windows PDF renderer
        run: cargo test --frozen -p natsume-print-client

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.node-version

      - name: Enable pnpm 11
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Setup pinned Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version-file: .deno-version

      - name: Prepare Web dependencies
        run: deno task prepare web

      - name: Dependency audit
        run: pnpm --dir web audit --audit-level high --registry https://registry.npmjs.org

      - name: Format
        run: pnpm --dir web format:check

      - name: ESLint
        run: pnpm --dir web lint

      - name: Typecheck
        run: deno task check web

      - name: Unit tests
        run: pnpm --dir web test

      - name: Install pinned Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm --dir web e2e
        env:
          CI: "true"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Install package build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            curl dpkg-dev libfontconfig1-dev libgl1-mesa-dev libudev-dev pkg-config tar xz-utils

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.node-version

      - name: Enable pnpm 11
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Setup pinned Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version-file: .deno-version

      - name: Prepare dependencies, tools and runtime assets
        run: deno task prepare

      - name: Build production binaries and Web
        run: deno task build server client print-domjudge

      - name: Build Deb packages
        run: |
          if [[ -n "$PACKAGE_VERSION" ]]; then
            deno task package --version "$PACKAGE_VERSION" --output dist/packages/ci
          else
            deno task package --ci --output dist/packages/ci
          fi
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase0-deb-content-smoke
          path: dist/packages/ci/*.deb
          if-no-files-found: error
          retention-days: 7
