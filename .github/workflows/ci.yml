name: ci

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]
  workflow_call:
    inputs:
      package_version:
        description: Debian package version
        type: string
        default: ""
      release_version:
        description: Portable package version (SemVer)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/cargo

jobs:
  checks:
    name: Shared checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare-build
        with:
          module: rust
          runner: ${{ matrix.os }}
          ubuntu-packages: dbus-daemon fonts-noto-cjk libfontconfig1-dev libgl1-mesa-dev libudev-dev openssl pkg-config
      - name: Rust format
        run: cargo fmt --all --check
      - name: Build-script checks
        if: runner.os == 'Linux'
        run: deno task check scripts
      - name: Compile and lint the Rust workspace
        run: deno task check rust
      - name: Build orchestration tests
        if: runner.os == 'Linux'
        run: deno task test scripts
      - name: Install pinned Helper test runner
        if: runner.os == 'Linux'
        run: cargo install cargo-nextest --version 0.9.150 --locked
      - name: Rust workspace tests
        run: deno task test rust
      - name: Test portable staging on Windows
        if: runner.os == 'Windows'
        run: deno test --cached-only --frozen --allow-read --allow-write=target --allow-env --deny-net tools/windows_test.ts
      - name: Install pinned dependency policy tool
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Dependency policy and advisories
        if: runner.os == 'Linux'
        run: cargo deny check

  modules:
    name: Module (${{ matrix.module }})
    needs: [checks, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - module: server
            os: ubuntu-24.04
            ubuntu_packages: curl dpkg-dev pkg-config
          - module: client
            os: ubuntu-24.04
            ubuntu_packages: curl dbus-daemon fonts-noto-cjk libfontconfig1-dev libgl1-mesa-dev libudev-dev pkg-config tar xz-utils
          - module: print-domjudge
            os: ubuntu-24.04
            ubuntu_packages: curl dpkg-dev pkg-config tar xz-utils
          - module: print-client
            os: windows-2022
            ubuntu_packages: ""
          - module: photo-client
            os: windows-2022
            ubuntu_packages: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare-build
        with:
          module: ${{ matrix.module }}
          runner: ${{ matrix.os }}
          ubuntu-packages: ${{ matrix.ubuntu_packages }}
      - name: Check Server-generated TypeScript bindings
        if: matrix.module == 'server'
        run: deno task api --check
      - name: Install pinned Server schema tool
        if: matrix.module == 'server'
        run: cargo install diesel_cli --version 2.3.12 --locked --no-default-features --features sqlite-bundled
      - name: Check the Server Diesel schema
        if: matrix.module == 'server'
        run: deno task schema:check
      - name: Build module release binaries and required Web assets
        run: deno task build ${{ matrix.module }}
      - name: Package CI build
        if: (runner.os == 'Windows' && inputs.release_version == '') || (runner.os != 'Windows' && inputs.package_version == '')
        run: deno task package ${{ matrix.module }} --ci --output dist/packages/ci
      - name: Package the requested release version
        if: (runner.os == 'Windows' && inputs.release_version != '') || (runner.os != 'Windows' && inputs.package_version != '')
        env:
          VERSION: ${{ runner.os == 'Windows' && inputs.release_version || inputs.package_version }}
        run: deno task package ${{ matrix.module }} --output dist/packages/ci
      - name: Upload the module's verified package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-${{ matrix.module }}-${{ runner.os }}-amd64
          path: dist/packages/ci/*
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare-build
        with:
          module: web
          rust: false
      - name: Dependency audit
        run: pnpm --dir web audit --audit-level high --registry https://registry.npmjs.org
      - name: Format
        run: pnpm --dir web format:check
      - name: ESLint
        run: pnpm --dir web lint
      - name: Typecheck
        run: deno task check web
      - name: Unit tests
        run: pnpm --dir web test
      - name: Install pinned Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: pnpm --dir web e2e
        env:
          CI: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
