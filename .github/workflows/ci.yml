name: ci

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            just libfontconfig1-dev libgl1-mesa-dev libudev-dev pkg-config

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Verify pinned toolchain
        run: just toolchain

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --all-features --locked --lib --bins --tests

      - name: Documentation tests
        run: cargo test --workspace --all-features --locked --doc

      - name: Dependency policy and advisories
        run: cargo deny check

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high --registry https://registry.npmjs.org

      - name: Format
        run: pnpm --filter @natsume/web format:check

      - name: ESLint
        run: pnpm --filter @natsume/web lint

      - name: Typecheck
        run: pnpm --filter @natsume/web typecheck

      - name: Unit tests
        run: pnpm --filter @natsume/web test

      - name: Production build
        run: pnpm --filter @natsume/web build

      - name: Install pinned Chromium
        run: pnpm --filter @natsume/web exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm --filter @natsume/web e2e
        env:
          CI: "true"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install just
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends just

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Regenerate Rust-owned OpenAPI and TypeScript snapshots
        run: |
          set -euo pipefail
          cargo run -p natsume-server --locked --bin export-openapi -- \
            web/openapi/natsume.openapi.json
          pnpm --filter @natsume/web openapi:lint
          pnpm --filter @natsume/web api:generate
          if ! git diff --exit-code -- \
            web/openapi/natsume.openapi.json \
            web/src/api/generated/schema.d.ts; then
            printf '%s\n' \
              'OpenAPI/TypeScript snapshots are stale; run just api and commit the result.' >&2
            exit 1
          fi

      - name: Install pinned diesel CLI
        run: cargo install diesel_cli --version 2.3.12 --locked --no-default-features --features sqlite-bundled

      - name: Diesel schema clean diff
        run: just diesel-schema

  policy-scan:
    name: policy-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1

      - name: Install policy dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends just

      - name: Install pinned policy tools
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/natsume-policy-tools"
          mkdir -p "${tool_dir}"

          shfmt_version="$(<tools/shfmt.version)"
          shfmt_asset="shfmt_v${shfmt_version}_linux_amd64"
          curl --fail --silent --show-error --location \
            "https://github.com/mvdan/sh/releases/download/v${shfmt_version}/${shfmt_asset}" \
            --output "${tool_dir}/${shfmt_asset}"
          (cd "${tool_dir}" && sha256sum -c "${GITHUB_WORKSPACE}/tools/shfmt.sha256")
          chmod 0755 "${tool_dir}/${shfmt_asset}"
          mv "${tool_dir}/${shfmt_asset}" "${tool_dir}/shfmt"

          gitleaks_version="$(<tools/gitleaks.version)"
          gitleaks_asset="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_asset}" \
            --output "${tool_dir}/${gitleaks_asset}"
          (cd "${tool_dir}" && sha256sum -c "${GITHUB_WORKSPACE}/tools/gitleaks.sha256")
          tar -xzf "${tool_dir}/${gitleaks_asset}" -C "${tool_dir}" gitleaks
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Static policy, shell format, and secret scan
        run: just ci-policy
      - name: XDG-only Session Agent package contract
        run: |
          set -euo pipefail
          test -f packaging/client/rootfs/etc/xdg/autostart/org.natsume.SessionAgent.desktop
          test ! -e packaging/client/rootfs/usr/lib/systemd/user/natsume-session-agent.service
          grep -Fxq 'Exec=/usr/bin/natsume-session-agent --autostart' packaging/client/rootfs/etc/xdg/autostart/org.natsume.SessionAgent.desktop

      - name: Server schema contract
        run: cargo test -p natsume-server --locked db::provisioning::schema_contract_tests

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1

      - name: Install package validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            gettext-base libfontconfig1-dev libgl1-mesa-dev libudev-dev pkg-config shellcheck

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build and inspect Deb packages
        run: bash packaging/ci-package-smoke.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase0-deb-content-smoke
          path: dist/packages/ci/*.deb
          if-no-files-found: error
          retention-days: 7
