name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_version: ${{ steps.version.outputs.release_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare-build
        with:
          module: scripts
          rust: false
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: deno task release:version

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ needs.version.outputs.package_version }}
      release_version: ${{ needs.version.outputs.release_version }}

  publish:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare-build
        with:
          module: scripts
          rust: false
      - name: Download verified module packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: package-*-amd64
          merge-multiple: true
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: deno task release:publish packages
