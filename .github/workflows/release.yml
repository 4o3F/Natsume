name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import re

          number = r"(?:0|[1-9][0-9]*)"
          match = re.fullmatch(
              rf"v({number}\.{number}\.{number})(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
              os.environ["RELEASE_TAG"],
          )
          if not match:
              raise SystemExit("Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease")
          version, prerelease = match.groups()
          if prerelease:
              if any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in prerelease.split(".")):
                  raise SystemExit("Numeric prerelease identifiers must not have leading zeroes")
              version += "~" + prerelease
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_version={version}\n")
              output.write(f"prerelease={str(prerelease is not None).lower()}\n")

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ needs.version.outputs.package_version }}

  publish:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: phase0-deb-content-smoke
          path: packages

      - name: Publish GitHub Release
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          packages=()
          for package in natsume-client natsume-server; do
            asset="${package}_${PACKAGE_VERSION}_amd64.deb"
            test "$(dpkg-deb --field "${asset}" Package)" = "${package}"
            test "$(dpkg-deb --field "${asset}" Version)" = "${PACKAGE_VERSION}"
            test "$(dpkg-deb --field "${asset}" Architecture)" = amd64
            packages+=("${asset}")
          done
          sha256sum "${packages[@]}" > SHA256SUMS
          release_flags=()
          if [[ ${PRERELEASE} == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "${RELEASE_TAG}" "${packages[@]}" SHA256SUMS \
            --verify-tag --generate-notes --title "${RELEASE_TAG}" "${release_flags[@]}"
