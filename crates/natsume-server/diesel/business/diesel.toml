[print_schema]
file = "schema.rs"
# SQLite STRICT requires INTEGER while these values use Diesel BigInt/i64.
patch_file = "sqlite-integer-to-bigint.patch"
filter.only_tables = [
  "^account_mappings$",
  "^accounts$",
  "^binding_negotiations$",
  "^device_bindings$",
  "^device_control_keys$",
  "^device_home_targets$",
  "^device_power_targets$",
  "^device_session_targets$",
  "^devices$",
  "^gateway_credentials$",
  "^operator_accounts$",
  "^operator_invitations$",
  "^operator_password_resets$",
  "^operator_sessions$",
  "^organizations$",
  "^pending_import_candidate$",
  "^photo_server_metadata$",
  "^photo_sources$",
  "^photo_initializations$",
  "^print_sources$",
  "^print_requests$",
  "^print_documents$",
  "^print_printers$",
  "^print_jobs$",
  "^print_attempts$",
  "^print_claims$",
  "^runtime_config$",
  "^seats$",
  "^server_vault_records$",
  "^site_identity$",
  "^target_submission_receipts$",
  "^teams$",
]

[migrations_directory]
dir = "migrations"
