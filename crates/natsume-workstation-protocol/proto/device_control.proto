syntax = "proto3";
package natsume.device.control;

import "device_control_handshake.proto";
import "device_control_state.proto";

message ServerHandshakeEnvelope {
  oneof body {
    ServerChallenge        server_challenge         = 1;
    EnrollmentReviewStatus enrollment_review_status = 2;
    // Sent only after Server authority activation commits. Gateway and Binding
    // are not part of these authority facts.
    EnrollmentAuthority    enrollment_activated     = 3;
    SessionReady           session_ready            = 4;
  }
}

message ClientHandshakeEnvelope {
  oneof body {
    ClientProof     client_proof     = 1;
    // Connection-local barrier proving the exact preceding authority facts
    // were installed crash-safely. Retry on this connection is idempotent.
    EnrollmentAuthority enrollment_ready = 2;
  }
}

message ClientActiveEnvelope {
  // Exact 16-byte echo of the connection's SessionReady UUIDv7 control lease.
  bytes session_id = 1;
  oneof body {
    // Complete replace-latest Client input plus target-derived actual state.
    ClientStateSnapshot client_state = 2;
  }
}

message ServerActiveEnvelope {
  // Exact 16-byte echo of this socket's SessionReady UUIDv7 control lease.
  bytes session_id = 1;
  oneof body {
    // Complete replace-latest Server intent plus resolved concrete targets.
    ServerStateSnapshot server_state = 2;
  }
}
