syntax = "proto3";
package natsume.device.control;

enum LockState {
  LOCK_STATE_UNSPECIFIED = 0;
  LOCK_STATE_UNLOCKED    = 1;
  LOCK_STATE_LOCKED      = 2;
}

// Device-level current target. terminate_epoch is a monotonic Transition in
// 1..=i64::MAX; absence means no terminate has ever been requested.
message SessionControlTarget {
  LockState        lock_state      = 1;
  optional uint64  terminate_epoch = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_NONE        = 1;
  SESSION_STATE_STARTING    = 2;
  SESSION_STATE_ACTIVE      = 3;
  SESSION_STATE_LOCKED      = 4;
  SESSION_STATE_TERMINATING = 5;
  SESSION_STATE_AMBIGUOUS   = 6;
  SESSION_STATE_ERROR       = 7;
}

message SessionControlActualState {
  SessionState    session_state             = 1;
  // Latest durably completed terminate epoch; never advances by retargeting an
  // old intent to a replacement graphical session.
  optional uint64 completed_terminate_epoch = 2;
}

// reset_epoch is a monotonic Transition in 1..=i64::MAX. Home reset affects only
// contestant Home and never control/Gateway identity-bound material.
message HomeTarget {
  optional uint64 reset_epoch = 1;
}

enum HomeState {
  HOME_STATE_UNSPECIFIED       = 0;
  HOME_STATE_STEADY            = 1;
  HOME_STATE_RESETTING         = 2;
  HOME_STATE_RECOVERY_REQUIRED = 3;
}

message HomeActualState {
  HomeState       state                 = 1;
  // Previous durable completion remains visible while a newer reset executes.
  optional uint64 completed_reset_epoch = 2;
}
