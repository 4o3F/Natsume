syntax = "proto3";
package natsume.device.control;

// Local DOMjudge password file installed by SYNC_SECRET. Not a certificate,
// control key, or Device Token.
enum CredentialState {
  CREDENTIAL_STATE_UNSPECIFIED = 0;
  // No password file on disk.
  CREDENTIAL_STATE_ABSENT = 1;
  // A password file is present and readable. Freshness is
  // installed_credential_revision vs accounts.credential_revision, not this variant.
  CREDENTIAL_STATE_INSTALLED = 2;
  // File is present but unusable (unreadable, corrupt, or apply failed).
  CREDENTIAL_STATE_FAILED = 3;
}

// Caddy data-plane health. Distinct from SYNC_STATE CommandStatus: a succeeded
// apply does not imply READY.
enum GatewayState {
  GATEWAY_STATE_UNSPECIFIED = 0;
  // No gateway config/material activated.
  GATEWAY_STATE_ABSENT = 1;
  // Intentionally not proxying (contest BLOCKED page).
  GATEWAY_STATE_BLOCKED = 2;
  // Reload / LKG restore in progress.
  GATEWAY_STATE_RESTORING = 3;
  // Local origin is serving and policy checks passed.
  GATEWAY_STATE_READY = 4;
  // Origin is up; fixed upstream is not healthy.
  GATEWAY_STATE_UPSTREAM_UNHEALTHY = 5;
  // Cannot prove a safe data-plane config; fail closed.
  GATEWAY_STATE_RECOVERY_REQUIRED = 6;
}

// Coarse current desktop occupancy. Lock/unlock/terminate are oneshot against
// whatever session this reports; not an occupancy UUID.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_NONE = 1;
  SESSION_STATE_STARTING = 2;
  SESSION_STATE_ACTIVE = 3;
  SESSION_STATE_LOCKED = 4;
  SESSION_STATE_TERMINATING = 5;
  SESSION_STATE_ERROR = 6;
}

// Slim Device-authored snapshot. Change + low-frequency periodic. No secrets,
// paths, or internal error chains. Server receive-time is not a Device field.
message ObservedStateSnapshot {
  // SHA-256 of the last successfully applied SyncState assignment; same 32 bytes
  // as SyncState.canonical_hash. Converge no-op when equal. Hash recipe is
  // Phase 5 D1 (not frozen).
  bytes applied_hash = 5;
  // Occupancy stamp of the Binding installed on Device; canonical lowercase
  // hyphenated UUIDv7. Empty = never installed. Not an integer revision.
  string installed_binding_id = 8;
  // accounts.credential_revision last written by SYNC_SECRET. 0 = never installed.
  uint64 installed_credential_revision = 9;
  // Local DOMjudge password file health. Pair with installed_credential_revision.
  CredentialState credential_state = 10;
  GatewayState gateway_state = 11;
  // SHA-256 of the raw SubjectPublicKeyInfo DER of the Gateway cert Caddy is
  // actually using. Empty if none.
  bytes gateway_certificate_fingerprint = 13;
  SessionState session_state = 14;
}
