syntax = "proto3";
package natsume.device.control;

// Local DOMjudge password file installed by SYNC_SECRET. Not a certificate,
// control key, or Device Token.
enum CredentialState {
  CREDENTIAL_STATE_UNSPECIFIED = 0;
  // No password file on disk.
  CREDENTIAL_STATE_ABSENT = 1;
  // A password file is present and readable. Freshness comes from comparing the
  // complete CredentialObservation with Server truth, not from this variant.
  CREDENTIAL_STATE_INSTALLED = 2;
  // File is present but unusable (unreadable, corrupt, or apply failed).
  CREDENTIAL_STATE_FAILED = 3;
}

// Caddy data-plane health. Distinct from SYNC_STATE CommandStatus: a succeeded
// apply does not imply READY.
enum GatewayState {
  GATEWAY_STATE_UNSPECIFIED = 0;
  // No gateway config/material activated.
  GATEWAY_STATE_ABSENT = 1;
  // Intentionally not proxying (contest BLOCKED page).
  GATEWAY_STATE_BLOCKED = 2;
  // Reload / LKG restore in progress.
  GATEWAY_STATE_RESTORING = 3;
  // Local origin is serving and policy checks passed.
  GATEWAY_STATE_READY = 4;
  // Origin is up; fixed upstream is not healthy.
  GATEWAY_STATE_UPSTREAM_UNHEALTHY = 5;
  // Cannot prove a safe data-plane config; fail closed.
  GATEWAY_STATE_RECOVERY_REQUIRED = 6;
}

// Coarse current desktop occupancy, not a Command target or occupancy UUID.
// Oneshot execution captures and revalidates the local current session instead
// of targeting this potentially stale observation.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_NONE = 1;
  SESSION_STATE_STARTING = 2;
  SESSION_STATE_ACTIVE = 3;
  SESSION_STATE_LOCKED = 4;
  SESSION_STATE_TERMINATING = 5;
  SESSION_STATE_ERROR = 6;
}

// Complete context of the local DOMjudge password artifact. ABSENT requires
// empty ids and revision zero. INSTALLED or FAILED requires canonical binding
// and Account UUIDv7 values and a revision in 1..=i64::MAX.
message CredentialObservation {
  string binding_id = 1;
  string account_id = 2;
  uint64 credential_revision = 3;
  CredentialState state = 4;
}

// Slim Device-authored snapshot. Change + low-frequency periodic. No secrets,
// paths, or internal error chains. Server receive-time is not a Device field.
message ObservedStateSnapshot {
  // Empty if no SyncState has ever been applied; otherwise the 32-byte SHA-256
  // derived from the last successfully applied typed SyncState. Converge no-ops
  // when it equals the Server-derived target hash.
  bytes applied_hash = 1;
  // Required after semantic decode; missing is not equivalent to ABSENT.
  CredentialObservation credential = 2;
  // Must not be UNSPECIFIED.
  GatewayState gateway_state = 3;
  // SHA-256 of the complete DER encoding of the leaf certificate Caddy is
  // actually using. The Server derives the expected value from the immutable
  // CredentialBundle.gateway_leaf_der. Absent means Caddy is not using a leaf;
  // present values are exactly 32 bytes. Presence is independent of
  // gateway_state: contradictory samples are drift evidence, not malformed.
  optional bytes gateway_leaf_sha256 = 4;
  // Must not be UNSPECIFIED.
  SessionState session_state = 5;
  // Latest durably completed HOME_RESET epoch. Absent means no HOME_RESET has
  // ever completed; present values are in 1..=i64::MAX and never decrease. While
  // a newer reset is in progress or recovery, report the previous completed epoch.
  optional uint64 completed_home_epoch = 6;
}
