syntax = "proto3";
package natsume.device.control;

// Server → Device: this socket is going away. reconnect_after is a hint, not a lease.
message ServerDrain {
  int64 reconnect_after_unix_ms = 1;
}

message ProtocolError {
  // ErrorCode registry token. Not a human-readable message.
  string error_code = 1;
}
