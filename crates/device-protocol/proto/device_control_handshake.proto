syntax = "proto3";
package natsume.device.control;

message ServerChallenge {
  uint32 protocol_version = 1;
  // Connection-local opaque random id; not a public Identifier UUID.
  bytes challenge_id = 2;
  bytes server_nonce = 3;
  // Connection-local proof deadline. Not OPEN_BINDING_PROMPT TTL.
  int64 expires_at_unix_ms = 4;
}

enum EvidenceQuality {
  EVIDENCE_QUALITY_UNSPECIFIED = 0;
  EVIDENCE_QUALITY_WEAK        = 1;
  EVIDENCE_QUALITY_MEDIUM      = 2;
  EVIDENCE_QUALITY_STRONG      = 3;
}

enum ProofIntent {
  PROOF_INTENT_UNSPECIFIED      = 0;
  PROOF_INTENT_FIRST_ENROLLMENT = 1;
  PROOF_INTENT_RESUME           = 2;
}

message ClientProof {
  uint32 protocol_version = 1;
  // Echo of ServerChallenge.challenge_id; connection-local opaque random id, not Identifier UUID.
  bytes challenge_id = 2;
  string daemon_version = 3;
  string agent_version = 4;
  ProofIntent intent = 5;
  // Derived hardware natural key, not Identifier UUID.
  string machine_hardware_id = 8;
  bytes signature = 10;
  // FIRST only.
  optional bytes candidate_public_key = 6;
  optional bytes gateway_csr_der = 7;
  // FIRST only: Device-claimed hardware-identity quality for operator review.
  optional EvidenceQuality evidence_quality = 9;
}

message CredentialBundle {
  bytes gateway_leaf_der = 1;
}

message CredentialAck {
  bytes bundle_sha256 = 1;
}

message SessionReady {
  // Connection-local lease id; not a public Identifier UUID.
  bytes session_id = 1;
}
