syntax = "proto3";
package natsume.device.control;

message ServerChallenge {
  uint32 protocol_version = 1;
  // Connection-local opaque random id; not a public Identifier UUID.
  bytes challenge_id = 2;
  bytes server_nonce = 3;
  // Connection-local proof deadline. Not OPEN_BINDING_PROMPT TTL.
  int64 expires_at_unix_ms = 4;
}

enum EvidenceQuality {
  EVIDENCE_QUALITY_UNSPECIFIED = 0;
  EVIDENCE_QUALITY_WEAK        = 1;
  EVIDENCE_QUALITY_MEDIUM      = 2;
  EVIDENCE_QUALITY_STRONG      = 3;
}

// Durable Enrollment transaction material. The Device creates and persists the
// canonical UUIDv7 enrollment_id, control key, Gateway key, and exact CSR before
// its first network attempt. Every retry for this transaction repeats these
// exact values; same id with different material is a conflict.
message EnrollmentAttempt {
  string enrollment_id = 1;
  bytes candidate_public_key = 2;
  bytes gateway_csr_der = 3;
  EvidenceQuality evidence_quality = 4;
}

// Active authority reconnect. The Server selects the active control key by the
// signed Machine Hardware ID; no Enrollment material is legal in this purpose.
message ResumeSession {}

message ClientProof {
  uint32 protocol_version = 1;
  // Echo of ServerChallenge.challenge_id; connection-local opaque random id, not Identifier UUID.
  bytes challenge_id = 2;
  string daemon_version = 3;
  string agent_version = 4;
  reserved 5, 6, 7, 9;
  reserved "intent", "candidate_public_key", "gateway_csr_der", "evidence_quality";
  // Derived hardware natural key, not Identifier UUID.
  string machine_hardware_id = 8;
  bytes signature = 10;
  // Durable local state selects exactly one purpose. Missing purpose is invalid;
  // the Server never rewrites Enrollment into Resume or vice versa.
  oneof purpose {
    EnrollmentAttempt enrollment = 11;
    ResumeSession resume = 12;
  }
}

message CredentialBundle {
  // Public Gateway leaf. The bundle hash is SHA-256 of the semantically
  // validated typed CredentialBundle encoded by the pinned Prost version.
  bytes gateway_leaf_der = 1;
  // Exact durable transaction echoed from ClientProof.enrollment.
  string enrollment_id = 2;
}

message CredentialAck {
  // Exact Ack is idempotent for both awaiting and already-active transactions.
  bytes bundle_sha256 = 1;
  string enrollment_id = 2;
}

// Durable Server authority has committed: Device, active control key, and
// active Gateway certificate exist and the Enrollment transaction is active.
// The Device persists these facts before answering EnrollmentReady.
message EnrollmentActivated {
  string enrollment_id = 1;
  string device_id = 2;
  bytes bundle_sha256 = 3;
}

// Connection-local barrier proving the Device has crash-safely persisted the
// activated manifest. This message is not durable Server state. An exact retry
// on this connection replays the same SessionReady; after disconnect an Active
// Device reconnects with ResumeSession instead.
message EnrollmentReady {
  // These fields exactly mirror the preceding EnrollmentActivated facts.
  string enrollment_id = 1;
  string device_id = 2;
  bytes bundle_sha256 = 3;
}

message SessionReady {
  // Connection-local lease id; not a public Identifier UUID.
  bytes session_id = 1;
}
