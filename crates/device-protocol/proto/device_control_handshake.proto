syntax = "proto3";
package natsume.device.control;

message ServerChallenge {
  // Exactly 32 CSPRNG bytes, owned only by this connection-local PreAuthSession.
  // The Server's local proof timer is deliberately not represented on the wire.
  bytes challenge_nonce = 1;
}

// Aggregate Enrollment evidence admitted by the fixed 2-of-3 hardware recipe.
// The current strong/strong/medium anchors make WEAK unreachable, so it is not
// part of this wire state space.
enum EnrollmentEvidenceQuality {
  ENROLLMENT_EVIDENCE_QUALITY_UNSPECIFIED = 0;
  ENROLLMENT_EVIDENCE_QUALITY_MEDIUM      = 1;
  ENROLLMENT_EVIDENCE_QUALITY_STRONG      = 2;
}

// Connection-local Enrollment material. The candidate private key is persisted
// before proof, but review and denial live only for this WSS connection. A new
// connection starts a new review unless this exact public key is already the
// committed current authority for the proved Machine Hardware ID.
message EnrollmentAttempt {
  bytes candidate_public_key = 1;
  // Aggregate quality of the accepted 2-of-3 hardware claim: the second-highest
  // quality among present anchors. Advisory to operator review; never authority.
  EnrollmentEvidenceQuality evidence_quality = 2;
}

// Connection-local operator-review state. Approval has no separate wire value:
// an attached candidate proceeds directly to enrollment_activated after the
// activation transaction commits. Disconnect discards pending/denied review.
// PENDING_REVIEW has an empty error_code; DENIED requires a bounded ErrorCode.
enum EnrollmentReviewState {
  ENROLLMENT_REVIEW_STATE_UNSPECIFIED    = 0;
  ENROLLMENT_REVIEW_STATE_PENDING_REVIEW = 1;
  ENROLLMENT_REVIEW_STATE_DENIED         = 2;
}

message EnrollmentReviewStatus {
  EnrollmentReviewState state = 1;
  // Empty for PENDING_REVIEW; required non-empty bounded ErrorCode token for DENIED.
  string error_code = 2;
}

// Active authority reconnect. The Server selects the active control key by the
// signed Machine Hardware ID; no Enrollment material is legal in this purpose.
message ResumeSession {}

message ClientProof {
  // Canonical SemVer of the currently running Device Daemon binary.
  string daemon_version   = 1;
  // Canonical SemVer of the installed Session Agent, whether or not it is running.
  string agent_version    = 2;
  // Derived hardware natural key, not Identifier UUID.
  string machine_hardware_id = 3;
  bytes  signature           = 4;
  // Durable local state selects exactly one purpose. Missing purpose is invalid;
  // the Server never rewrites Enrollment into Resume or vice versa.
  oneof purpose {
    EnrollmentAttempt enrollment = 5;
    ResumeSession     resume     = 6;
  }
}

// Exact committed Enrollment authority facts shared by the Server's
// enrollment_activated barrier and the Client's enrollment_ready barrier.
// The envelope field names express direction and phase; duplicating this
// payload into two message types would add no state or validation boundary.
message EnrollmentAuthority {
  string device_id = 1;
}

message SessionReady {
  // Server-generated UUIDv7 as exactly 16 RFC 9562 network-order bytes. This is
  // a connection-local, non-persisted control lease, not a public Identifier.
  // Each Device has at most one current lease; a new connection supersedes it.
  bytes session_id = 1;
}
