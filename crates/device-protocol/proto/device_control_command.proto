syntax = "proto3";
package natsume.device.control;

import "device_control_common.proto";

// Device → Server, at most one terminal status per delivery attempt. A
// Converge command may reuse the same command_id after connection recovery;
// Server accepts status only for the current lease's matching in-flight command.
// UNSPECIFIED is the proto3 default trap: reject after decode.
enum CommandState {
  COMMAND_STATE_UNSPECIFIED = 0;
  COMMAND_STATE_SUCCEEDED   = 1;
  COMMAND_STATE_FAILED      = 2;
}

message CommandStatus {
  // Panel-owned canonical lowercase hyphenated UUIDv7; echo of Command.command_id.
  string       command_id = 1;
  CommandState state      = 2;
  // Empty on SUCCEEDED; required non-empty bounded ErrorCode token on FAILED.
  // Unknown well-formed tokens remain opaque and never become behavior or text.
  string error_code = 3;
}

// Server → Device. Server creation time is not on this frame; Command has no deadline.
message Command {
  // Panel-owned canonical lowercase hyphenated UUIDv7, preserved end-to-end.
  string command_id = 1;
  oneof body {
    // Converge: re-push while Observed.applied_hash differs from the canonical
    // hash derived from this typed assignment.
    SyncState sync_state = 2;
    // Converge on the complete binding/account/revision credential context.
    SyncSecret sync_secret = 3;
    // Oneshot: SUCCEEDED when the prompt screen is opened, not when bind is confirmed.
    OpenBindingPrompt open_binding_prompt = 4;
    // Oneshot: current graphical session only; no reconnect replay.
    LockSession      lock_session      = 5;
    UnlockSession    unlock_session    = 6;
    TerminateSession terminate_session = 7;
    // Converge: same home_epoch is reentrant; do not bump epoch on retry.
    ResetHome reset_home = 8;
  }
}

message UnboundAssignment {}

message BoundAssignment {
  // Current occupancy stamp; canonical lowercase hyphenated UUIDv7.
  string binding_id = 1;
  // Canonical Account UUIDv7. Credential revision is scoped to this Account.
  string account_id = 2;
  // Seat natural key, not Identifier UUID.
  string seat_code = 3;
  // DOMjudge username for /login injection.
  string domjudge_username = 4;
}

// Non-secret assignment. Server and Device derive applied_hash by encoding this
// semantically validated SyncState with pinned Prost length-delimited encoding;
// the hash is not transmitted as mutable input. No passwords, certs, or
// packaged profile ids.
message SyncState {
  oneof assignment {
    UnboundAssignment unbound = 1;
    BoundAssignment bound = 2;
  }
}

// Seat password. Operator-triggered; not auto-fired by assignment drift.
// Device refuses unless its applied assignment has the same binding_id and
// account_id. Convergence compares the complete context plus credential state.
message SyncSecret {
  // Must match the Device's current occupancy; canonical lowercase hyphenated UUIDv7.
  string binding_id = 1;
  // Must match the Account in the Device's current applied assignment.
  string account_id = 2;
  // accounts.credential_revision in 1..=i64::MAX. Already installed at this
  // complete binding/account/revision context → no-op.
  uint64 credential_revision = 3;
  // Required DOMjudge password plaintext. The wrapper must be present and its
  // value must be the exact non-empty, valid UTF-8, control-free Account
  // password in 1..=512 bytes. Never log, persist in Observed, or put in Debug.
  SecretBytes password = 4;
}

// Oneshot: lock the Device's current graphical session. Empty body; no occupancy
// target. Requires the current ready lease and is never replayed after reconnect.
// SUCCEEDED after the native session lock is applied.
message LockSession {}

// Oneshot: unlock the current session. No expected_lock_command_id; at most one
// lock is held. Contestant does not know the password; this is operator-triggered.
message UnlockSession {}

// Oneshot: end the current graphical session. Does not reset Home or unbind.
message TerminateSession {}

// Oneshot: open the closed binding-prompt screen. SUCCEEDED when the screen is
// shown, not when bind is confirmed. Confirm is BindingRequest; Server answers
// BindingResult. No TTL, no catalog id, no seat_code.
message OpenBindingPrompt {}

// Converge: local Prepare/Activate/Recover/GC for this epoch. Same epoch retry
// is reentrant (in-progress → Recover; already done → success no-op).
// HOME_EPOCH_STALE only if home_epoch < the completed epoch. Do not bump on retry.
// Does not drop daemon WSS. Do not start a managed session until Activate succeeds.
message ResetHome {
  // Server durable epoch in 1..=i64::MAX.
  uint64 home_epoch = 1;
}
