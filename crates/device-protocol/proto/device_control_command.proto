syntax = "proto3";
package natsume.device.control;

// Device → Server, at most one terminal status per command_id.
// UNSPECIFIED is the proto3 default trap: reject after decode.
enum CommandState {
  COMMAND_STATE_UNSPECIFIED = 0;
  COMMAND_STATE_SUCCEEDED   = 1;
  COMMAND_STATE_FAILED      = 2;
}

message CommandStatus {
  // Panel-owned canonical lowercase hyphenated UUIDv7; echo of Command.command_id.
  string       command_id = 1;
  CommandState state      = 2;
  // ErrorCode registry token. Empty on SUCCEEDED. Not a human-readable message.
  string error_code = 3;
}

// Server → Device. created_at/deadline live in HTTP/DB only, not on this frame.
message Command {
  // Panel-owned canonical lowercase hyphenated UUIDv7, preserved end-to-end.
  string command_id = 1;
  oneof body {
    // Converge: re-push while Observed.applied_hash != canonical_hash.
    SyncState sync_state = 6;
    // Converge: re-push while Observed.installed_credential_revision != credential_revision.
    SyncSecret sync_secret = 7;
    // Oneshot: SUCCEEDED when the prompt screen is opened, not when bind is confirmed.
    OpenBindingPrompt open_binding_prompt = 8;
    // Oneshot: current graphical session only; no reconnect replay.
    LockSession      lock_session      = 9;
    UnlockSession    unlock_session    = 10;
    TerminateSession terminate_session = 11;
    // Converge: same home_epoch is reentrant; do not bump epoch on retry.
    ResetHome reset_home = 12;
  }
}

// Non-secret assignment. Device recomputes canonical_hash over these fields
// (recipe D1, not frozen) and no-ops when it matches Observed.applied_hash.
// No passwords, certs, or packaged profile ids.
message SyncState {
  // SHA-256 of this assignment. Same 32 bytes Device stores as applied_hash.
  bytes canonical_hash = 2;
  // Occupancy stamp; canonical lowercase hyphenated UUIDv7. Empty = unbound → BLOCKED.
  string binding_id = 3;
  // Seat natural key. Empty when unbound.
  string seat_code = 4;
  // DOMjudge username for /login injection. Empty when unbound.
  string domjudge_username = 5;
}

// Seat password. Operator-triggered; not auto-fired by assignment drift.
// Device refuses if the current Binding row is missing or binding_id differs.
message SyncSecret {
  // Must match the Device's current occupancy; canonical lowercase hyphenated UUIDv7.
  string binding_id = 2;
  // accounts.credential_revision. Already installed at this revision → no-op.
  uint64 credential_revision = 4;
  // DOMjudge password plaintext. Never log, persist in Observed, or put in Debug.
  bytes password = 5;
}

// Oneshot: lock the Device's current graphical session. Empty body; no occupancy
// target. Offline = discarded. SUCCEEDED after the native session lock is applied.
message LockSession {}

// Oneshot: unlock the current session. No expected_lock_command_id; at most one
// lock is held. Contestant does not know the password; this is operator-triggered.
message UnlockSession {}

// Oneshot: end the current graphical session. Does not reset Home or unbind.
message TerminateSession {}

// Oneshot: open the closed binding-prompt screen. SUCCEEDED when the screen is
// shown, not when bind is confirmed. Confirm is BindingRequest; Server answers
// BindingResult. No TTL, no catalog id, no seat_code.
message OpenBindingPrompt {}

// Converge: local Prepare/Activate/Recover/GC for this epoch. Same epoch retry
// is reentrant (in-progress → Recover; already done → success no-op).
// HOME_EPOCH_STALE only if home_epoch < the completed epoch. Do not bump on retry.
// Does not drop daemon WSS. Do not start a managed session until Activate succeeds.
message ResetHome {
  uint64 home_epoch = 2;
}
