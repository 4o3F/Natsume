[package]
name = "natsume-print-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
snafu.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6", default-features = false }
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
rfd = { version = "0.18.0", default-features = false }
rpassword.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-software"] }
tokio.workspace = true
toml = { workspace = true, features = ["display"] }
tray-icon = { version = "0.26.0", default-features = false }
url.workspace = true
windows = { workspace = true, features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Security_Credentials",
  "Storage_Streams",
  "UI",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
slint = { workspace = true, features = ["backend-winit-wayland", "renderer-software"] }

[dev-dependencies]
hex.workspace = true
rcgen = { workspace = true, features = ["pem"] }
