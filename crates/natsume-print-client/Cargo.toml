[package]
name = "natsume-print-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
rpassword.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
tokio.workspace = true
toml = { workspace = true, features = ["display"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6", default-features = false }
rfd = { version = "0.17.2", default-features = false }
slint = { workspace = true, features = ["backend-winit", "renderer-software"] }
tray-icon = { version = "0.25.1", default-features = false }
windows = { workspace = true, features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Security_Credentials",
  "Storage_Streams",
  "UI",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
] }

[dev-dependencies]
slint = { workspace = true, features = ["backend-winit-wayland", "renderer-software"] }
rcgen = { workspace = true, features = ["pem"] }
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
