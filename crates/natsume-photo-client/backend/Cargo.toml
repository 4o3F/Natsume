[package]
name = "natsume-photo-client"
description = "Natsume Photo offline client backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
natsume-photo-protocol = { path = "../../natsume-photo-protocol" }
clap.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
image.workspace = true
chrono.workspace = true
kamadak-exif.workspace = true
moxcms.workspace = true
png.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
snafu.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
url.workspace = true
zeroize.workspace = true
zip.workspace = true

libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
windows = { workspace = true, features = ["Security_Credentials", "Storage", "Storage_Search", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[target.'cfg(windows)'.dev-dependencies]
rcgen = { workspace = true, features = ["pem"] }
rustls.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
