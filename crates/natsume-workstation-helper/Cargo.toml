[package]
name = "natsume-workstation-helper"
description = "Root, no-network Natsume helper for typed privileged actions, hardware evidence and Home transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "natsume-privileged-helper"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
nix = { version = "0.29", features = ["fs"] }
keyutils = "0.4"
keyutils-raw = "0.4"
snafu.workspace = true
natsume-workstation-ipc = { path = "../natsume-workstation-ipc" }
procfs = { version = "0.18", default-features = false }
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
smbios-lib = "0.9"
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true
wayland-client = "0.31"
zbus.workspace = true
zeroize.workspace = true

[lints]
workspace = true
